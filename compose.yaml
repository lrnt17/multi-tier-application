services:
  api:
    build:
      context: ./src/api/MultiTierApplication
      target: runtime
    ports:
      - "8000:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Database=todos;Username=postgres;Password=devpass"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migrator:
    build:
      context: ./src/api/MultiTierApplication
      target: migrator
    environment:
      ConnectionStrings__Default: "Host=db;Database=todos;Username=postgres;Password=devpass"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: todos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./src/web
    ports:
      - "3000:8080"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata: